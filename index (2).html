<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3d2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Dompet Rumah</title>
<style>
:root{--bg:#f6f5f0;--ink:#1d2a22;--mut:#6b766e;--line:#dfddd2;--ok:#2f7d4f;--warn:#d98a00;--bad:#c23b2e;--brand:#1f3d2b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:88px}
header{background:var(--brand);color:#fff;padding:20px 16px 18px}
header small{opacity:.75}
.sisa{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 10px}
.bar{height:8px;border-radius:4px;background:#ffffff30;overflow:hidden}
.bar i{display:block;height:100%;background:#fff}
#alert{margin:12px 16px 0;padding:12px;border-radius:10px;background:#fff3d6;border:1px solid #f0d28a;font-size:14px;display:none}
ul{list-style:none;margin:8px 16px;padding:0}
li{padding:14px 0;border-bottom:1px solid var(--line)}
.r{display:flex;justify-content:space-between;gap:8px}
.r b{font-weight:600}
.r span{color:var(--mut);font-size:14px}
.pb{height:6px;border-radius:3px;background:var(--line);margin:8px 0 4px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ok)}
.w .pb i{background:var(--warn)}.x .pb i{background:var(--bad)}
.x .pct{color:var(--bad)}.w .pct{color:var(--warn)}
.pct{font-size:13px;font-weight:600}
button,select,input{font:inherit}
.fab{position:fixed;right:16px;bottom:20px;background:var(--brand);color:#fff;border:0;border-radius:28px;padding:16px 22px;font-weight:600;box-shadow:0 4px 14px #0003}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:#0006}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.act{display:flex;gap:8px;margin-top:18px}
.act button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff}
.act .p{background:var(--brand);color:#fff;border-color:var(--brand)}
li{cursor:pointer}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:16px}
.foot a{color:var(--mut)}
</style>
</head>
<body>
<header>
  <small>Sisa anggaran bulan ini</small>
  <div class="sisa" id="sisa">Rp 0</div>
  <div class="bar"><i id="tot"></i></div>
  <small id="tinfo"></small>
</header>
<div id="alert"></div>
<ul id="list"></ul>
<div class="foot"><a href="#" id="cfg">Ubah URL Sheets</a> · <a href="#" id="thr">Ambang notifikasi</a> · <a href="#" id="kat2">+ Kategori</a></div>
<button class="fab" id="add">+ Catat</button>

<dialog id="dlg">
  <h3 style="margin:0">Catat pengeluaran</h3>
  <label>Kategori</label><select id="kat"></select>
  <label>Jumlah (Rp)</label><input id="jml" type="number" inputmode="numeric" placeholder="50000">
  <label>Catatan</label><input id="cat" placeholder="opsional">
  <div class="act"><button id="batal">Batal</button><button class="p" id="simpan">Simpan</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const LS = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let data = [];

// Ambang notifikasi: default 75% terpakai (= sisa 25%)
const thr = () => Number(LS.get('thr') || 75);

function url(){
  let u = LS.get('url');
  if(!u){ u = prompt('Tempel URL Web App Apps Script:') || ''; if(u) LS.set('url', u.trim()); }
  return u;
}
$('cfg').onclick = e => { e.preventDefault(); const u = prompt('URL Web App Apps Script:', LS.get('url')||''); if(u){LS.set('url',u.trim()); load();} };
$('thr').onclick = e => { e.preventDefault(); const v = prompt('Notifikasi saat terpakai berapa %?', thr()); if(v){LS.set('thr', Number(v)); render();} };

async function load(){
  const u = url(); if(!u) return;
  try{ data = await (await fetch(u)).json(); LS.set('cache', JSON.stringify(data)); }
  catch(e){ try{ data = JSON.parse(LS.get('cache')||'[]'); }catch(_){ data = []; } }
  render(true);
}

function render(){
  const T = data.reduce((s,d)=>s+d.nominal,0), R = data.reduce((s,d)=>s+d.realisasi,0);
  $('sisa').textContent = rp(T-R);
  $('tot').style.width = Math.min(100, T? R/T*100 : 0) + '%';
  $('tinfo').textContent = `Terpakai ${rp(R)} dari ${rp(T)}`;
  $('list').innerHTML = data.map((d,i)=>{
    const p = d.nominal ? d.realisasi/d.nominal*100 : 0;
    const c = p>=100 ? 'x' : p>=thr() ? 'w' : '';
    return `<li class="${c}" data-i="${i}"><div class="r"><b>${d.nama}</b><span>${rp(d.realisasi)} / ${rp(d.nominal)}</span></div>
      <div class="pb"><i style="width:${Math.min(100,p)}%"></i></div>
      <span class="pct">${Math.round(p)}% terpakai · sisa ${rp(d.nominal-d.realisasi)}</span></li>`;
  }).join('');
  $('kat').innerHTML = data.map(d=>`<option>${d.nama}</option>`).join('');
  const near = data.filter(d => d.nominal && d.realisasi/d.nominal*100 >= thr());
  $('alert').style.display = near.length ? 'block' : 'none';
  $('alert').textContent = near.length ? 'Hampir habis: ' + near.map(d=>d.nama).join(', ') : '';
}

async function notify(title, body){
  try{
    if(!('Notification' in window)) return;
    if(Notification.permission === 'default') await Notification.requestPermission();
    if(Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    reg.showNotification(title, {body, icon:'icon.svg', badge:'icon.svg', vibrate:[200,100,200]});
  }catch(e){}
}

$('add').onclick = () => { if(!data.length) return load(); $('dlg').showModal(); };
$('batal').onclick = () => $('dlg').close();
$('simpan').onclick = async () => {
  const jumlah = Number($('jml').value), kategori = $('kat').value;
  if(!jumlah || jumlah<=0) return;
  const before = Object.fromEntries(data.map(d=>[d.nama, d.nominal ? d.realisasi/d.nominal*100 : 0]));
  $('simpan').disabled = true;
  try{
    const res = await fetch(url(), {method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({kategori, jumlah, catatan: $('cat').value})});
    data = await res.json();
    LS.set('cache', JSON.stringify(data));
    $('dlg').close(); $('jml').value=''; $('cat').value='';
    render();
    // notifikasi kalau kategori baru melewati ambang / 100%
    for(const d of data){
      const p = d.nominal ? d.realisasi/d.nominal*100 : 0, b = before[d.nama] ?? 0;
      if(p>=100 && b<100) notify(`${d.nama} melebihi anggaran`, `Terpakai ${rp(d.realisasi)} dari ${rp(d.nominal)}`);
      else if(p>=thr() && b<thr()) notify(`${d.nama} hampir habis`, `Sisa ${rp(d.nominal-d.realisasi)} (${Math.round(p)}% terpakai)`);
    }
  }catch(e){ alert('Gagal menyimpan. Cek koneksi dan URL Sheets.'); }
  $('simpan').disabled = false;
};


async function kirim(payload){
  try{
    const res = await fetch(url(), {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload)});
    data = await res.json(); LS.set('cache', JSON.stringify(data)); render();
  }catch(e){ alert('Gagal menyimpan. Cek koneksi dan URL Sheets.'); }
}
const angka = v => Number(String(v).replace(/\D/g,''));
// Ketuk kategori untuk ubah anggaran atau hapus
$('list').onclick = e => {
  const li = e.target.closest('li'); if(!li) return;
  const d = data[li.dataset.i];
  const v = prompt(`Anggaran ${d.nama} (Rp)\nKetik "hapus" untuk menghapus kategori`, d.nominal);
  if(v === null) return;
  if(v.trim().toLowerCase() === 'hapus'){ if(confirm(`Hapus kategori ${d.nama}?`)) kirim({action:'budget', nama:d.nama, hapus:true}); return; }
  const n = angka(v); if(n > 0) kirim({action:'budget', nama:d.nama, nominal:n});
};
$('kat2').onclick = e => {
  e.preventDefault();
  const nama = (prompt('Nama kategori baru:') || '').trim(); if(!nama) return;
  const n = angka(prompt('Anggaran per bulan (Rp):') || ''); if(n > 0) kirim({action:'budget', nama, nominal:n});
};

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
